<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{const t=localStorage.getItem("toeddro-theme");if(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");}catch(e){};</script>
    <title>Toeddro | India&#39;s Adventure Operator Directory</title>
    <meta name="description" content="Discover adventure operators across India with Toeddro. Explore trekking, rafting, paragliding, scuba, camping, safari and more, then connect with operators directly.">
    <link rel="canonical" href="https://toeddro.com/" />
    <meta name="author" content="Toeddro" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://toeddro.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Toeddro" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="https://toeddro.com/og-image.jpg">
    
  
  
  
  <meta property="og:title" content="Toeddro | India&#39;s Adventure Directory">
  <meta name="twitter:title" content="Toeddro | India&#39;s Adventure Directory">
  <meta property="og:description" content="Find trekking, rafting, paragliding &amp; more operators across India. No middlemen, no markup. Contact them directly.">
  <meta name="twitter:description" content="Find trekking, rafting, paragliding &amp; more operators across India. No middlemen, no markup. Contact them directly.">

  <!-- Sitewide Organization + WebSite JSON-LD. Per-route pages inject
       LocalBusiness, ItemList, Event, BlogPosting, FAQPage etc. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Toeddro",
    "alternateName": "Toeddro Adventure Directory",
    "url": "https://toeddro.com",
    "logo": "https://toeddro.com/og-image.jpg",
    "description": "An independent, zero-commission adventure operator directory across India, covering trekking, rafting, paragliding, scuba, skydiving, bungee, camping, biking, safari, climbing and wellness.",
    "areaServed": { "@type": "Country", "name": "India" },
    "sameAs": ["https://toeddro.com"]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Toeddro",
    "url": "https://toeddro.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://toeddro.com/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
